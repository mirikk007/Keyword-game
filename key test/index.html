<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>⚡ Key Accuracy Challenge</title>
</head>
<body>

<h1>⚡ KEY ACCURACY CHALLENGE ⚡</h1>

<div id="menu" class="panel">
  <p>Проверь скорость и точность ввода!</p>
  <label>⏱ Выбери время:</label><br>
  <select id="time">
    <option value="30">30 секунд</option>
    <option value="60" selected>60 секунд</option>
    <option value="90">90 секунд</option>
  </select><br>
  <button id="startBtn">▶️ Играть</button>
</div>

<div id="game" class="panel hidden">
  <div class="timer" id="timer">⏱ Осталось: 60</div>
  <div class="word-box" id="wordBox">ready?</div>
  <input type="text" id="input" placeholder="Введи слово..." autocomplete="off">
  <div class="stats">
    ✅ Правильных: <span id="correct">0</span> |
    ❌ Ошибок: <span id="wrong">0</span>
  </div>

  <div class="button-group">
    <button id="pauseBtn">⏸ Пауза</button>
    <button id="restartBtn">🔁 Заново</button>
  </div>
</div>

<div id="result" class="panel hidden">
  <h2>🏁 Игра окончена!</h2>
  <p>✅ Правильных слов: <span id="finalCorrect">0</span></p>
  <p>❌ Ошибок: <span id="finalWrong">0</span></p>
  <p class="game-over">Нажми "Играть", чтобы начать заново!</p>
  <button id="playAgainBtn">▶️ Играть снова</button>
</div>
<script src="script.js"></script>
</body>
</html>
